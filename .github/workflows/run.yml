name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 1 * * *'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug secrets
        run: |
          echo "GLADOS set? ${GLADOS:+yes}"
          echo "NOTIFY set? ${NOTIFY:+yes}"
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}

      - name: Run GLaDOS checkin
        run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}

      - name: Finished
        if: always()
        run: echo "Finished main script."
